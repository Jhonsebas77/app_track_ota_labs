name: app_track_ota_labs
description: "A app to track my other develops"
publish_to: "none"

version: 1.0.0+10

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^3.1.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  nested: ^1.0.0
  package_info_plus: ^9.0.0
  provider: ^6.1.5+1
  recase: ^4.1.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic

flutter_native_splash:
  color: "#0b1623"
  image: assets/splash.png
  branding: assets/branding.png
  image_dark: assets/splash.png
  branding_dark: assets/branding.png
  android_12:
    image: assets/splash.png
    color: "#0b1623"
    branding: assets/branding.png
    branding_dark: assets/branding.png
  ios: true
